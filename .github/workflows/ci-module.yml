name: ci

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional test selector forwarded to the test runner; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read #  for actions/checkout

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        node: ['latest', '22', '20']

    runs-on: ${{ matrix.os }}-latest
    name: ${{ matrix.os }} node@${{ matrix.node }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-05-04T16:10:25.480000Z
      - name: install
        run: npm install
      - name: test
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx lab -a @hapi/code -L -Y -v -g "${{ inputs.test-filter }}"
          else
            npm test
          fi

  pack:
    runs-on: ubuntu-latest
    name: pack
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: registry time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-05-04T16:10:25.480000Z
      - name: install
        run: npm install
      - name: build browser bundle
        run: cd browser && npm install && npm run build
      - name: pin npm to the publishing version
        run: npm i -g npm@11.12.1
      - name: pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: joi-*.tgz
          if-no-files-found: error
